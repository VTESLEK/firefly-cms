<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Firefly 后台管理</title>
    <link rel="stylesheet" href="/style.css?v=2.0" />
    <script>
      // 提前应用主题（默认深色，Art Design Pro 风格）
      (() => {
        const t = localStorage.getItem("cms_theme");
        const dark = t ? t === "dark" : true;
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <!-- 登录 -->
    <section id="view-login" class="view center">
      <div class="login-card">
        <div class="login-logo">
          <svg viewBox="0 0 24 24" width="34" height="34" fill="none" aria-hidden="true">
            <circle cx="12" cy="9" r="3.2" fill="var(--accent)" />
            <path d="M12 13.5c-3.6 0-5.5 2.2-6.5 4.5h13c-1-2.3-2.9-4.5-6.5-4.5Z" fill="var(--accent)" opacity=".55" />
            <path d="M4.5 4.5 6 6M19.5 4.5 18 6M12 2v1.6" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" />
          </svg>
          <span>Firefly 后台管理</span>
        </div>
        <p class="muted">输入访问密码登录，保存后自动提交到 GitHub 并触发博客部署。</p>
        <input id="login-password" type="password" placeholder="访问密码" autocomplete="current-password" />
        <button id="login-btn" class="btn primary block">登 录</button>
        <p id="login-msg" class="msg"></p>
      </div>
    </section>

    <!-- 主界面 -->
    <section id="view-main" class="view hidden">
      <div id="sidebar-mask" class="sidebar-mask hidden"></div>

      <!-- 侧边栏 -->
      <aside id="sidebar">
        <div class="logo">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" aria-hidden="true">
            <circle cx="12" cy="9" r="3.2" fill="var(--accent)" />
            <path d="M12 13.5c-3.6 0-5.5 2.2-6.5 4.5h13c-1-2.3-2.9-4.5-6.5-4.5Z" fill="var(--accent)" opacity=".55" />
            <path d="M4.5 4.5 6 6M19.5 4.5 18 6M12 2v1.6" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" />
          </svg>
          <span class="logo-text">Firefly CMS</span>
        </div>
        <nav class="menu">
          <button class="menu-item active" data-page="dashboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
            <span>工作台</span>
          </button>
          <button class="menu-item" data-page="posts">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/></svg>
            <span>文章管理</span>
          </button>
          <button class="menu-item" data-page="shuoshuo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8z"/></svg>
            <span>说说管理</span>
          </button>
          <button class="menu-item" data-page="links">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            <span>友链管理</span>
          </button>
        </nav>
        <div class="sidebar-footer">
          <a href="https://xane.eu.cc" target="_blank" rel="noopener">前往博客 ↗</a>
          <span>v2.0</span>
        </div>
      </aside>

      <!-- 主区域 -->
      <div class="main-area">
        <header class="topbar">
          <button id="menu-toggle" class="icon-btn" title="菜单">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
          <div id="breadcrumb" class="breadcrumb">后台 / 工作台</div>
          <div class="flex-spacer"></div>
          <button id="theme-toggle" class="icon-btn" title="切换明暗主题">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
          </button>
          <button id="logout-btn" class="icon-btn" title="退出登录">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          </button>
        </header>

        <main class="content">
          <!-- 工作台 -->
          <section id="page-dashboard" class="page">
            <div class="stat-grid">
              <div class="card stat-card">
                <div class="stat-icon blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/></svg></div>
                <div><div class="stat-num" id="stat-posts">-</div><div class="stat-label">文章总数</div></div>
              </div>
              <div class="card stat-card">
                <div class="stat-icon orange"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></div>
                <div><div class="stat-num" id="stat-drafts">-</div><div class="stat-label">草稿箱</div></div>
              </div>
              <div class="card stat-card">
                <div class="stat-icon green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8z"/></svg></div>
                <div><div class="stat-num" id="stat-shuoshuo">-</div><div class="stat-label">说说</div></div>
              </div>
              <div class="card stat-card">
                <div class="stat-icon purple"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></div>
                <div><div class="stat-num" id="stat-links">-</div><div class="stat-label">友链（启用）</div></div>
              </div>
            </div>
            <div class="card">
              <div class="card-head">
                <h2>最近文章</h2>
                <button class="btn ghost small" data-goto="posts">全部文章 →</button>
              </div>
              <div id="recent-list"></div>
              <p id="recent-msg" class="msg center-text"></p>
            </div>
          </section>

          <!-- 文章管理 -->
          <section id="page-posts" class="page hidden">
            <div id="posts-list-view">
              <div class="page-head">
                <h1>文章管理</h1>
                <div class="flex-spacer"></div>
                <button id="new-post-btn" class="btn primary">＋ 写新文章</button>
              </div>
              <div class="card">
                <div id="posts-table"></div>
                <p id="posts-msg" class="msg center-text"></p>
              </div>
            </div>

            <div id="post-editor-view" class="hidden">
              <div class="page-head">
                <button id="p-back" class="btn ghost small">← 返回列表</button>
                <h1 id="p-editor-title">写新文章</h1>
                <div class="flex-spacer"></div>
                <button id="p-save" class="btn primary">发布文章</button>
              </div>
              <div class="editor-grid">
                <div class="editor-main card">
                  <input id="p-title" type="text" placeholder="输入文章标题…" class="title-input" />
                  <div class="md-toolbar">
                    <button type="button" data-md="bold" title="加粗"><strong>B</strong></button>
                    <button type="button" data-md="italic" title="斜体"><em>I</em></button>
                    <button type="button" data-md="h2" title="二级标题">H2</button>
                    <button type="button" data-md="h3" title="三级标题">H3</button>
                    <button type="button" data-md="quote" title="引用">❝</button>
                    <button type="button" data-md="code" title="行内代码">&lt;/&gt;</button>
                    <button type="button" data-md="link" title="链接">🔗</button>
                    <label class="file-label md-img-btn" title="上传图片并插入">🖼 图片<input id="p-image" type="file" accept="image/png,image/jpeg,image/gif,image/webp,image/avif" hidden /></label>
                  </div>
                  <textarea id="p-content" rows="18" placeholder="正文内容，支持 Markdown 语法…" spellcheck="false"></textarea>
                  <div class="row meta-row">
                    <span class="muted" id="p-wordcount"></span>
                    <span class="flex-spacer"></span>
                    <span class="muted">保存后 1-3 分钟内博客自动更新</span>
                  </div>
                  <p id="p-msg" class="msg"></p>
                </div>
                <div class="editor-side card">
                  <h3>发布设置</h3>
                  <label class="field">
                    <span class="field-label">Slug（URL，创建后不可改）</span>
                    <input id="p-slug" type="text" placeholder="留空自动生成" />
                  </label>
                  <label class="field">
                    <span class="field-label">发布日期</span>
                    <input id="p-published" type="date" />
                  </label>
                  <label class="field">
                    <span class="field-label">更新日期（编辑时默认今天）</span>
                    <input id="p-updated" type="date" />
                  </label>
                  <label class="field">
                    <span class="field-label">分类</span>
                    <input id="p-category" type="text" placeholder="技术" />
                  </label>
                  <label class="field">
                    <span class="field-label">标签（回车添加）</span>
                    <div id="p-tags-box" class="tags-box"><input id="p-tag" placeholder="回车添加" /></div>
                  </label>
                  <label class="field">
                    <span class="field-label">摘要</span>
                    <textarea id="p-description" rows="3" placeholder="显示在文章列表与卡片上的一句话"></textarea>
                  </label>
                  <div class="field">
                    <span class="field-label">封面图</span>
                    <div id="p-cover-preview" class="img-preview hidden">
                      <img alt="封面预览" />
                      <span class="img-path"></span>
                      <button id="p-cover-remove" class="btn danger ghost small">移除</button>
                    </div>
                    <label class="btn ghost file-label block">上传封面<input id="p-cover" type="file" accept="image/png,image/jpeg,image/gif,image/webp,image/avif" hidden /></label>
                  </div>
                  <div class="switch-col">
                    <label class="switch"><input id="p-draft" type="checkbox" /><span>草稿（保存后博客不展示）</span></label>
                    <label class="switch"><input id="p-pinned" type="checkbox" /><span>置顶</span></label>
                    <label class="switch"><input id="p-comment" type="checkbox" checked /><span>允许评论</span></label>
                  </div>
                </div>
              </div>
            </div>
          </section>

          <!-- 说说管理 -->
          <section id="page-shuoshuo" class="page hidden">
            <div class="page-head"><h1>说说管理</h1></div>
            <div class="card editor-card">
              <h2 id="editor-title">发布说说</h2>
              <textarea id="f-content" rows="4" placeholder="写点什么…支持 Markdown 语法"></textarea>
              <div class="row tags-row">
                <div id="tags-box" class="tags-box">
                  <input id="f-tag" placeholder="输入标签后回车添加" />
                </div>
              </div>
              <div id="image-preview" class="img-preview hidden">
                <img alt="配图预览" />
                <span class="img-path"></span>
                <button id="img-remove" class="btn danger ghost small">移除配图</button>
              </div>
              <div class="row actions-row">
                <input id="f-date" type="datetime-local" title="发布时间（东八区）" />
                <label class="btn ghost file-label">
                  添加配图
                  <input id="f-image" type="file" accept="image/png,image/jpeg,image/gif,image/webp,image/avif" hidden />
                </label>
                <span class="flex-spacer"></span>
                <button id="cancel-btn" class="btn ghost hidden">取消编辑</button>
                <button id="publish-btn" class="btn primary">发布</button>
              </div>
              <p id="editor-msg" class="msg"></p>
            </div>
            <div id="posts-list" class="posts-list"></div>
            <p id="list-msg" class="msg center-text"></p>
          </section>

          <!-- 友链管理 -->
          <section id="page-links" class="page hidden">
            <div class="page-head"><h1>友链管理</h1></div>
            <div class="card editor-card">
              <h2 id="link-editor-title">添加友链</h2>
              <div class="form-grid">
                <label class="field">
                  <span class="field-label">名称 *</span>
                  <input id="lf-title" type="text" placeholder="站点名称" />
                </label>
                <label class="field">
                  <span class="field-label">站点地址 *</span>
                  <input id="lf-siteurl" type="url" placeholder="https://example.com" />
                </label>
                <label class="field">
                  <span class="field-label">头像图片地址</span>
                  <input id="lf-imgurl" type="url" placeholder="https://…/avatar.png" />
                </label>
                <label class="field">
                  <span class="field-label">标签（逗号分隔）</span>
                  <input id="lf-tags" type="text" placeholder="Blog, Astro" />
                </label>
                <label class="field span-2">
                  <span class="field-label">站点描述</span>
                  <input id="lf-desc" type="text" placeholder="一句话介绍" />
                </label>
                <label class="field">
                  <span class="field-label">权重（越大越靠前）</span>
                  <input id="lf-weight" type="number" value="0" />
                </label>
                <label class="field check-field">
                  <span class="field-label">启用</span>
                  <input id="lf-enabled" type="checkbox" checked />
                </label>
              </div>
              <div class="row actions-row">
                <span class="flex-spacer"></span>
                <button id="lf-cancel" class="btn ghost hidden">取消编辑</button>
                <button id="lf-add" class="btn primary">添加到列表</button>
              </div>
              <p id="lf-editor-msg" class="msg"></p>
            </div>

            <div class="row links-toolbar">
              <span class="muted" id="links-count"></span>
              <span class="flex-spacer"></span>
              <button id="links-save" class="btn primary">保存全部更改</button>
            </div>

            <div id="links-list" class="links-list"></div>
            <p id="links-msg" class="msg center-text"></p>
          </section>
        </main>
      </div>
    </section>

    <script src="/app.js?v=2.0"></script>
  </body>
</html>
